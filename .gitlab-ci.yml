stages:
  - prepare
  - test
  - build
  - publish
  - release

variables:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"
  ZIG_VERSION: "0.14.1"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.cache/pnpm/store"
  # Public base URL where binaries, icons, and release metadata are served.
  PUBLIC_DOWNLOAD_BASE: "https://cdn.usescrolls.com"

.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go/build
      - .cache/go/pkg/mod

.pnpm-cache: &pnpm-cache
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .cache/pnpm/store

# ---------------------------------------------------------------------------
# Prepare — build the desktop release image on the default branch
# ---------------------------------------------------------------------------
build-ci-image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - 'printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\"}}}" "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json'
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/.gitlab/ci/desktop-build.Dockerfile" --build-arg GO_VERSION="${GO_VERSION}" --build-arg ZIG_VERSION="${ZIG_VERSION}" --destination "${CI_REGISTRY_IMAGE}/desktop-build:go${GO_VERSION}-zig${ZIG_VERSION}" --destination "${CI_REGISTRY_IMAGE}/desktop-build:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/desktop-build.Dockerfile
        - go.mod
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ---------------------------------------------------------------------------
# Test — Go coverage
# ---------------------------------------------------------------------------
go-test:
  stage: test
  image: golang:${GO_VERSION}
  <<: *go-cache
  script:
    - go test -v -coverprofile=coverage.out ./internal/...
    - go run github.com/boumenot/gocover-cobertura@v1.4.0 < coverage.out > coverage.xml
    - GO_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
    - 'echo "Go coverage: ${GO_COV}%"'
  coverage: '/Go coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Test — frontend tests and production bundle
# ---------------------------------------------------------------------------
frontend:
  stage: test
  image: node:${NODE_VERSION}-bookworm
  <<: *pnpm-cache
  before_script:
    - corepack enable
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
    - pnpm --dir frontend install --frozen-lockfile --prefer-offline
  script:
    - pnpm --dir frontend run test:coverage
    - pnpm --dir frontend run build
  artifacts:
    paths:
      - frontend/dist
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Build — Linux AMD64
# ---------------------------------------------------------------------------
build-linux-amd64:
  stage: build
  image: "$CI_REGISTRY_IMAGE/desktop-build:go${GO_VERSION}-zig${ZIG_VERSION}"
  <<: *go-cache
  needs:
    - job: go-test
      artifacts: false
    - job: frontend
      artifacts: true
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X gitlab.com/usescrolls/scribe/internal.Version=$VERSION -X gitlab.com/usescrolls/scribe/internal.PublicDownloadBase=$PUBLIC_DOWNLOAD_BASE" -o scribe-linux-amd64 .
  artifacts:
    paths:
      - scribe-linux-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Build — Windows AMD64 (cross-compiled from Linux, no CGO)
# ---------------------------------------------------------------------------
build-windows-amd64:
  stage: build
  image: golang:${GO_VERSION}
  <<: *go-cache
  needs:
    - job: go-test
      artifacts: false
    - job: frontend
      artifacts: true
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H windowsgui -X gitlab.com/usescrolls/scribe/internal.Version=$VERSION -X gitlab.com/usescrolls/scribe/internal.PublicDownloadBase=$PUBLIC_DOWNLOAD_BASE" -o scribe-windows-amd64.exe .
  artifacts:
    paths:
      - scribe-windows-amd64.exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Publish — upload Linux/Windows binaries and static assets to Cloudflare R2
# macOS is published locally from a tagged macOS checkout via
# scripts/release-macos-local.sh, which also writes the final latest manifest.
# ---------------------------------------------------------------------------
publish-cdn:
  stage: publish
  image: alpine:latest
  needs:
    - build-linux-amd64
    - build-windows-amd64
  before_script:
    - apk add --no-cache rclone
    - ': "${CDN_BUCKET:?CDN_BUCKET CI/CD variable is required. If it is protected, protect release tags (for example v*).}"'
    - ': "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID CI/CD variable is required. If it is protected, protect release tags (for example v*).}"'
    - ': "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY CI/CD variable is required. If it is protected, protect release tags (for example v*).}"'
    - ': "${R2_ENDPOINT:?R2_ENDPOINT CI/CD variable is required. If it is protected, protect release tags (for example v*).}"'
    - |
      cat > /tmp/rclone.conf <<EOF
      [r2]
      type = s3
      provider = Cloudflare
      access_key_id = ${R2_ACCESS_KEY_ID}
      secret_access_key = ${R2_SECRET_ACCESS_KEY}
      endpoint = ${R2_ENDPOINT}
      no_check_bucket = true
      EOF
    - export RCLONE_CONFIG=/tmp/rclone.conf
  script:
    - rclone copyto scribe-linux-amd64 "r2:${CDN_BUCKET}/scribe-linux-amd64"
    - rclone copyto scribe-windows-amd64.exe "r2:${CDN_BUCKET}/scribe-windows-amd64.exe"
    - rclone copyto icons/AppIcon.icns "r2:${CDN_BUCKET}/icons/AppIcon.icns"
    - rclone copyto icons/icon.png "r2:${CDN_BUCKET}/icons/icon.png"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Release — create GitLab release with changelog
# ---------------------------------------------------------------------------
release:
  stage: release
  image: alpine:latest
  needs:
    - publish-cdn
  before_script:
    - apk add --no-cache git curl git-cliff
  script:
    - git fetch --tags
    - git cliff --latest --strip header > CHANGELOG.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./CHANGELOG.md
    assets:
      links:
        - name: scribe-linux-amd64
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-linux-amd64"
          filepath: /scribe-linux-amd64
        - name: scribe-windows-amd64.exe
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-windows-amd64.exe"
          filepath: /scribe-windows-amd64.exe
        - name: scribe-darwin-arm64
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-darwin-arm64"
          filepath: /scribe-darwin-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
