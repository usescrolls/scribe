stages:
  - test
  - build
  - publish
  - release

variables:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  ZIG_VERSION: "0.14.1"
  # Public base URL where binaries, icons, and release metadata are served.
  PUBLIC_DOWNLOAD_BASE: "https://cdn.usescrolls.com"
  CDN_BUCKET: "usescrolls-cdn"

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - apt-get update && apt-get install -y
        libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
        pkg-config nodejs npm jq
    - corepack enable && corepack prepare pnpm@latest --activate
    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
    - wails3 generate bindings
  script:
    # Go tests
    - go test -v -coverprofile=coverage.out ./internal/...
    - GO_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
    - 'echo "Go coverage: ${GO_COV}%"'

    # Frontend tests
    - cd frontend
    - pnpm install
    - pnpm add -D @vitest/coverage-v8
    - pnpm run test:coverage || true
    - cd ..
  coverage: '/Go coverage:\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Build — Linux AMD64
# ---------------------------------------------------------------------------
build-linux-amd64:
  stage: build
  image: golang:${GO_VERSION}
  needs: [test]
  before_script:
    - apt-get update && apt-get install -y
        libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
        pkg-config nodejs npm
    - corepack enable && corepack prepare pnpm@latest --activate
    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
    - wails3 generate bindings
  script:
    - cd frontend && pnpm install && pnpm run build && cd ..
    - VERSION=${CI_COMMIT_TAG#v}
    - CGO_ENABLED=1 GOOS=linux GOARCH=amd64
        go build -ldflags="-s -w -X gitlab.com/usescrolls/scribe/internal.Version=$VERSION -X gitlab.com/usescrolls/scribe/internal.PublicDownloadBase=$PUBLIC_DOWNLOAD_BASE"
        -o scribe-linux-amd64 .
  artifacts:
    paths:
      - scribe-linux-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Build — Windows AMD64 (cross-compiled from Linux, no CGO)
# ---------------------------------------------------------------------------
build-windows-amd64:
  stage: build
  image: golang:${GO_VERSION}
  needs: [test]
  before_script:
    - apt-get update && apt-get install -y nodejs npm
    - corepack enable && corepack prepare pnpm@latest --activate
    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
    - wails3 generate bindings
  script:
    - cd frontend && pnpm install && pnpm run build && cd ..
    - VERSION=${CI_COMMIT_TAG#v}
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64
        go build -ldflags="-s -w -H windowsgui -X gitlab.com/usescrolls/scribe/internal.Version=$VERSION -X gitlab.com/usescrolls/scribe/internal.PublicDownloadBase=$PUBLIC_DOWNLOAD_BASE"
        -o scribe-windows-amd64.exe .
  artifacts:
    paths:
      - scribe-windows-amd64.exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Build — macOS ARM64 (cross-compiled from Linux via zig cc)
# ---------------------------------------------------------------------------
build-darwin-arm64:
  stage: build
  image: golang:${GO_VERSION}
  needs: [test]
  before_script:
    - apt-get update && apt-get install -y nodejs npm xz-utils
    - corepack enable && corepack prepare pnpm@latest --activate

    # Install zig (used as a cross-compiler for CGO → darwin)
    - curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
        | tar -xJ -C /usr/local
    - ln -s /usr/local/zig-linux-x86_64-${ZIG_VERSION}/zig /usr/local/bin/zig

    # Wrapper scripts so Go can use zig as CC/CXX
    - |
      cat > /usr/local/bin/zcc <<'ZIGCC'
      #!/bin/sh
      exec zig cc -target aarch64-macos "$@"
      ZIGCC
      chmod +x /usr/local/bin/zcc
    - |
      cat > /usr/local/bin/zxx <<'ZIGXX'
      #!/bin/sh
      exec zig c++ -target aarch64-macos "$@"
      ZIGXX
      chmod +x /usr/local/bin/zxx

    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
    - wails3 generate bindings
  script:
    - cd frontend && pnpm install && pnpm run build && cd ..
    - VERSION=${CI_COMMIT_TAG#v}
    - CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC=zcc CXX=zxx
        go build -ldflags="-s -w -X gitlab.com/usescrolls/scribe/internal.Version=$VERSION -X gitlab.com/usescrolls/scribe/internal.PublicDownloadBase=$PUBLIC_DOWNLOAD_BASE"
        -o scribe-darwin-arm64 .
  artifacts:
    paths:
      - scribe-darwin-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Publish — upload binaries and release manifest to Cloudflare R2
# ---------------------------------------------------------------------------
publish-cdn:
  stage: publish
  image: alpine:latest
  needs:
    - build-linux-amd64
    - build-windows-amd64
    - build-darwin-arm64
  before_script:
    - apk add --no-cache rclone
    # Configure rclone for Cloudflare R2
    - |
      cat > /tmp/rclone.conf <<EOF
      [r2]
      type = s3
      provider = Cloudflare
      access_key_id = ${R2_ACCESS_KEY_ID}
      secret_access_key = ${R2_SECRET_ACCESS_KEY}
      endpoint = ${R2_ENDPOINT}
      no_check_bucket = true
      EOF
    - export RCLONE_CONFIG=/tmp/rclone.conf
  script:
    - VERSION=${CI_COMMIT_TAG#v}

    # Upload binaries
    - rclone copyto scribe-linux-amd64 "r2:${CDN_BUCKET}/scribe-linux-amd64"
    - rclone copyto scribe-windows-amd64.exe "r2:${CDN_BUCKET}/scribe-windows-amd64.exe"
    - rclone copyto scribe-darwin-arm64 "r2:${CDN_BUCKET}/scribe-darwin-arm64"

    # Upload icons for the install script
    - rclone copyto icons/AppIcon.icns "r2:${CDN_BUCKET}/icons/AppIcon.icns"
    - rclone copyto icons/icon.png "r2:${CDN_BUCKET}/icons/icon.png"

    # Generate and upload release manifest (GitHub-compatible JSON)
    - |
      cat > /tmp/latest.json <<MANIFEST
      {
        "tag_name": "${CI_COMMIT_TAG}",
        "html_url": "${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}",
        "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "assets": [
          {"name": "scribe-linux-amd64", "browser_download_url": "${PUBLIC_DOWNLOAD_BASE}/scribe-linux-amd64"},
          {"name": "scribe-darwin-arm64", "browser_download_url": "${PUBLIC_DOWNLOAD_BASE}/scribe-darwin-arm64"},
          {"name": "scribe-windows-amd64.exe", "browser_download_url": "${PUBLIC_DOWNLOAD_BASE}/scribe-windows-amd64.exe"}
        ]
      }
      MANIFEST
    - rclone copyto /tmp/latest.json "r2:${CDN_BUCKET}/releases/latest"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ---------------------------------------------------------------------------
# Release — create GitLab release with changelog
# ---------------------------------------------------------------------------
release:
  stage: release
  image: alpine:latest
  needs:
    - publish-cdn
  before_script:
    - apk add --no-cache git curl git-cliff
  script:
    - git fetch --tags
    - git cliff --latest --strip header > CHANGELOG.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./CHANGELOG.md
    assets:
      links:
        - name: scribe-linux-amd64
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-linux-amd64"
          filepath: /scribe-linux-amd64
        - name: scribe-windows-amd64.exe
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-windows-amd64.exe"
          filepath: /scribe-windows-amd64.exe
        - name: scribe-darwin-arm64
          url: "${PUBLIC_DOWNLOAD_BASE}/scribe-darwin-arm64"
          filepath: /scribe-darwin-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
