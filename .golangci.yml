version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - commentFormatting

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

      - path: frontend/bindings/
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/usescrolls/scribe

  exclusions:
    paths:
      - frontend/bindings/
