name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./internal/...

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Build frontend
        run: |
          cd frontend && npm install && npm run build

      - name: Build Linux AMD64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o scribe-linux-amd64 .

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: scribe-linux-amd64
          path: scribe-linux-amd64

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend && npm install && npm run build

      - name: Build Windows AMD64
        run: |
          go build -ldflags="-s -w -H windowsgui" -o scribe-windows-amd64.exe .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: scribe-windows-amd64.exe
          path: scribe-windows-amd64.exe

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build frontend
        run: |
          cd frontend && npm install && npm run build

      - name: Build macOS binaries
        run: |
          mkdir -p build
          # Build for both architectures
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/scribe-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/scribe-darwin-amd64 .
          # Create universal binary for the app bundle
          lipo -create -output build/scribe-darwin-universal build/scribe-darwin-arm64 build/scribe-darwin-amd64
          # Copy universal as the detected arch binary (macOS runners are arm64 now)
          cp build/scribe-darwin-universal build/scribe-darwin-arm64

      - name: Create app bundle
        run: ./packaging/macos/create-app.sh

      - name: Create DMG
        run: |
          ./packaging/macos/create-dmg.sh
          # Rename to expected name
          mv build/Scribe-Installer.dmg build/scribe-Installer.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: scribe-Installer.dmg
          path: build/scribe-Installer.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/scribe-linux-amd64/scribe-linux-amd64 release/
          cp artifacts/scribe-windows-amd64.exe/scribe-windows-amd64.exe release/
          cp artifacts/scribe-Installer.dmg/scribe-Installer.dmg release/
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/scribe-linux-amd64
            release/scribe-windows-amd64.exe
            release/scribe-Installer.dmg
          generate_release_notes: true

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: usescrolls/homebrew-tap
          event-type: update-cask
