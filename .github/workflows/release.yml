name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate bindings
        run: wails3 generate bindings

      - name: Run Go tests with coverage
        run: |
          go test -v -coverprofile=coverage.out ./internal/...
          GO_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "GO_COVERAGE=$GO_COV" >> $GITHUB_ENV

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          pnpm install
          pnpm add -D @vitest/coverage-v8
          pnpm run test:coverage || true
          # Extract coverage from vitest json-summary output
          if [ -f coverage/coverage-summary.json ]; then
            FE_COV=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            echo "FE_COVERAGE=$FE_COV" >> $GITHUB_ENV
          else
            echo "FE_COVERAGE=0" >> $GITHUB_ENV
          fi

      - name: Update Go coverage badge
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: go-coverage.json
          label: Go coverage
          message: ${{ env.GO_COVERAGE }}%
          valColorRange: ${{ env.GO_COVERAGE }}
          maxColorRange: 100
          minColorRange: 0

      - name: Update frontend coverage badge
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: frontend-coverage.json
          label: Frontend coverage
          message: ${{ env.FE_COVERAGE }}%
          valColorRange: ${{ env.FE_COVERAGE }}
          maxColorRange: 100
          minColorRange: 0
          forceUpdate: true

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate bindings
        run: wails3 generate bindings

      - name: Build frontend
        run: |
          cd frontend && pnpm install && pnpm run build

      - name: Build Linux AMD64
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/usescrolls/scribe/internal.Version=$VERSION" -o scribe-linux-amd64 .

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: scribe-linux-amd64
          path: scribe-linux-amd64

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate bindings
        run: wails3 generate bindings

      - name: Build frontend
        run: |
          cd frontend && pnpm install && pnpm run build

      - name: Build Windows AMD64
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart("v")
          go build -ldflags="-s -w -H windowsgui -X github.com/usescrolls/scribe/internal.Version=$VERSION" -o scribe-windows-amd64.exe .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: scribe-windows-amd64.exe
          path: scribe-windows-amd64.exe

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate bindings
        run: wails3 generate bindings

      - name: Build frontend
        run: |
          cd frontend && pnpm install && pnpm run build

      - name: Build macOS binary
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build
          # Build for native architecture (arm64 on macos-latest)
          # Wails v3 requires CGO for darwin platform code
          CGO_ENABLED=1 go build -ldflags="-s -w -X github.com/usescrolls/scribe/internal.Version=$VERSION" -o build/scribe-darwin-arm64 .

      - name: Create app bundle
        run: VERSION=${GITHUB_REF_NAME#v} ./packaging/macos/create-app.sh

      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF_NAME#v} ./packaging/macos/create-dmg.sh
          # Rename to expected name
          mv build/Scribe-Installer.dmg build/scribe-Installer.dmg

      - name: Upload macOS standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: scribe-darwin-arm64
          path: build/scribe-darwin-arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: scribe-Installer.dmg
          path: build/scribe-Installer.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/scribe-linux-amd64/scribe-linux-amd64 release/
          cp artifacts/scribe-windows-amd64.exe/scribe-windows-amd64.exe release/
          cp artifacts/scribe-darwin-arm64/scribe-darwin-arm64 release/
          cp artifacts/scribe-Installer.dmg/scribe-Installer.dmg release/
          ls -la release/

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --latest --strip header

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            release/scribe-linux-amd64
            release/scribe-windows-amd64.exe
            release/scribe-darwin-arm64
            release/scribe-Installer.dmg

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: usescrolls/homebrew-tap
          event-type: update-cask
